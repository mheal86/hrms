<div class="toast-wrapper">
  <div
    *ngFor="let toast of notificationService.toasts()"
    class="toast-item alert d-flex align-items-center justify-content-between gap-2"
    [class.alert-success]="toast.type === 'success'"
    [class.alert-danger]="toast.type === 'error'"
  >
    <span>{{ toast.message }}</span>
    <button type="button" class="btn-close ms-auto" (click)="notificationService.remove(toast.id)"></button>
  </div>
</div>
