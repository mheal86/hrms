<nav class="navbar app-navbar px-4 py-0 d-flex justify-content-between">
  <div class="d-flex align-items-center gap-3">
    <p-button
      class="d-md-none"
      icon="pi pi-bars"
      [text]="true"
      severity="secondary"
      (onClick)="sidebarState.toggle()"
      styleClass="hamburger-btn"
      [attr.aria-label]="'NAVBAR.TOGGLE_SIDEBAR' | translate"
    ></p-button>

    <!-- Nút toggle sidebar cho Desktop bằng PrimeNG -->
    <p-button
      class="d-none d-md-inline-block sidebar-trigger-btn"
      [class.collapsed]="sidebarState.isDesktopCollapsed()"
      icon="pi pi-chevron-left"
      [text]="true"
      severity="secondary"
      (onClick)="sidebarState.toggleDesktop()"
      [attr.aria-label]="'NAVBAR.TOGGLE_SIDEBAR' | translate"
    ></p-button>

    <span class="navbar-brand mb-0 h1">{{ 'NAVBAR.BRAND' | translate }}</span>
  </div>

  @if (authService.getUser(); as user) {
    <div class="d-flex align-items-center gap-2">
      <!-- Language Switcher Dropdown -->
      <div class="lang-switcher-wrapper d-none d-sm-flex align-items-center">
        <p-select
          [options]="languageService.languages"
          optionLabel="label"
          optionValue="code"
          [ngModel]="languageService.currentLang()"
          (ngModelChange)="onLangChange($event)"
          styleClass="lang-select"
          panelStyleClass="lang-select-overlay"
          [panelStyle]="{ 'z-index': '99999', 'margin-top': '4px' }"
          [placeholder]="'NAVBAR.LANGUAGE' | translate"
          appendTo="body"
        >
          <ng-template #selectedItem let-lang>
            <span class="lang-option">{{ lang.label }}</span>
          </ng-template>
          <ng-template #item let-lang>
            <span class="lang-option">{{ lang.label }}</span>
          </ng-template>
        </p-select>
      </div>

      <!-- Theme Toggle -->
      <p-button
        styleClass="theme-toggle-btn"
        [text]="true"
        severity="secondary"
        (onClick)="toggleTheme()"
        [title]="(isDarkMode ? 'NAVBAR.LIGHT_MODE' : 'NAVBAR.DARK_MODE') | translate"
      >
        <!-- Icon Mặt trời (khi ở chế độ Tối) -->
        @if (isDarkMode) {
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="sun-icon"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        }
        <!-- Icon Mặt trăng (khi ở chế độ Sáng) -->
        @if (!isDarkMode) {
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="moon-icon"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </p-button>

      <span class="navbar-user-text d-none d-sm-inline">
        {{ user.username }}
      </span>

      <p-button
        [outlined]="true"
        severity="secondary"
        size="small"
        styleClass="logout-btn d-flex align-items-center justify-content-center"
        (click)="onLogout()"
        [title]="'NAVBAR.LOGOUT' | translate"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </p-button>
    </div>
  }
</nav>
