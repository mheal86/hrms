<div class="page-fade">
<h3>{{ isEditMode() ? 'Sửa phòng ban' : 'Thêm phòng ban mới' }}</h3>

<app-spinner *ngIf="isLoading()"></app-spinner>
<div *ngIf="errorMessage()" class="alert alert-danger">{{ errorMessage() }}</div>

<div class="card" style="max-width: 500px;">
  <div class="card-body p-4">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Tên phòng ban <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          formControlName="name"
          [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
        />
        <div class="invalid-feedback" *ngIf="form.get('name')?.errors?.['required']">Tên phòng ban là bắt buộc</div>
        <div class="invalid-feedback" *ngIf="form.get('name')?.errors?.['specialChars']">Tên phòng ban không được chứa ký tự đặc biệt</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Mô tả</label>
        <textarea class="form-control" formControlName="description" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-primary me-2" [disabled]="isLoading()">Lưu</button>
      <button type="button" class="btn btn-secondary"
        (mousedown)="$event.preventDefault()"
        (click)="onCancel()">Hủy</button>
    </form>
  </div>
</div>
</div>
