<div class="login-wrapper">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </div>
      <h4 class="mt-3 mb-0">HRMS</h4>
      <p class="text-muted small">Hệ thống quản lý nhân sự</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          formControlName="username"
          placeholder="Nhập username"
          [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
        />
        <div class="invalid-feedback">Username là bắt buộc</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            placeholder="Nhập password"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()" tabindex="-1">
            <svg *ngIf="!showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <div class="invalid-feedback">Password là bắt buộc</div>
      </div>

      <div class="alert alert-danger py-2" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading()">
        {{ isLoading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>
  </div>
</div>
