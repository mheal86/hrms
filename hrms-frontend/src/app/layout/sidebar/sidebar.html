@if (sidebarState.isOpen()) {
  <div class="sidebar-backdrop d-md-none" (click)="sidebarState.close()"></div>
}

<aside
  class="app-sidebar"
  [class.sidebar-open]="sidebarState.isOpen()"
  [class.collapsed]="sidebarState.isDesktopCollapsed()"
>
  <ul class="nav flex-column p-3">
    @for (item of menuItems; track item.link) {
      @if (!item.adminOnly || authService.isAdmin()) {
        <li class="nav-item">
          <a
            class="nav-link"
            [routerLink]="item.link"
            routerLinkActive="active fw-bold"
            ariaCurrentWhenActive="page"
            (click)="sidebarState.close()"
            [title]="item.label | translate"
          >
            <i [class]="item.icon + ' nav-icon'"></i>
            <span class="nav-text">{{ item.label | translate }}</span>
          </a>
        </li>
      }
    }
  </ul>
</aside>
