<div class="login-wrapper">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-icon">
        <i class="pi pi-user text-white"></i>
      </div>
      <h4 class="mt-3 mb-0">{{ 'AUTH.TITLE' | translate }}</h4>
      <p class="text-muted small">{{ 'AUTH.SUBTITLE' | translate }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <formly-form [form]="loginForm" [fields]="loginFields" [model]="loginModel"></formly-form>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2">
          {{ errorMessage() }}
        </div>
      }

      <p-button
        type="submit"
        [label]="isLoading() ? ('AUTH.LOGGING_IN' | translate) : ('AUTH.LOGIN_BTN' | translate)"
        [disabled]="isLoading()"
        styleClass="w-100"
      ></p-button>
    </form>
  </div>
</div>
