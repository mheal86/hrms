<p-select
  [options]="options"
  optionLabel="label"
  optionValue="value"
  [placeholder]="placeholder"
  [disabled]="disabled"
  [invalid]="isInvalid"
  [showClear]="showClear"
  [filter]="filter"
  [(ngModel)]="val"
  (onChange)="onSelectChange($event)"
  (onBlur)="onSelectBlur()"
  styleClass="w-full"
  panelStyleClass="custom-select-panel"
>
</p-select>
