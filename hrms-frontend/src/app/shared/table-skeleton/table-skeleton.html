<p-table [value]="rowsArray" styleClass="p-datatable-sm">
  <ng-template #header>
    <tr>
      @for (c of columnsArray; track $index) {
        <th><p-skeleton width="60%" height="14px"></p-skeleton></th>
      }
    </tr>
  </ng-template>
  <ng-template #body>
    <tr>
      @for (c of columnsArray; track $index) {
        <td><p-skeleton width="100%" height="16px"></p-skeleton></td>
      }
    </tr>
  </ng-template>
</p-table>
